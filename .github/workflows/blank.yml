<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تعمیرات تخصصی لوازم خانگی محمد کرمی در تهران | تعمیر در منزل، تماس سریع، خدمات حرفه‌ای و فوری">
    <meta name="keywords" content="تعمیرات لوازم خانگی, تعمیر لباسشویی, تعمیر یخچال, تعمیر ظرفشویی, محمد کرمی, تهران, ونک">
    <meta name="author" content="محمد کرمی">
    <title>تعمیرات لوازم خانگی - محمد کرمی</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #eef6fb, #ffffff);
            color: #222;
            direction: rtl;
            text-align: right;
            line-height: 1.9;
        }

        header {
            background: linear-gradient(135deg, #123a5a, #1f6b8c);
            color: #fff;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
        }

        header p {
            margin: 12px 0 0;
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .hero {
            background: #fff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin-top: -35px;
            position: relative;
            z-index: 2;
            border: 1px solid #e8eef3;
        }

        .hero h2 {
            margin-top: 0;
            color: #123a5a;
            font-size: 1.8rem;
        }

        .hero p {
            margin-bottom: 0;
            font-size: 1.08rem;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.25s ease;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1f9d55, #2ecc71);
            color: #fff;
        }

        .btn-secondary {
            background: #eef4f8;
            color: #123a5a;
            border: 1px solid #d7e3ea;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 26px rgba(0,0,0,0.07);
            border: 1px solid #edf2f6;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.12);
        }

        .card h3, .card h2 {
            margin-top: 0;
            color: #123a5a;
        }

        .features ul,
        .card ul {
            padding-right: 18px;
            margin: 0;
        }

        .features li,
        .card li {
            margin-bottom: 10px;
        }

        .highlight {
            background: linear-gradient(135deg, #fff7e6, #fffdf8);
            border-right: 5px solid #f0b429;
            padding: 18px;
            border-radius: 12px;
            margin: 18px 0;
            font-weight: bold;
        }

        .contact-box {
            background: linear-gradient(135deg, #f8fbff, #eef7ff);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #dceaf4;
        }

        .contact-item {
            margin-bottom: 10px;
        }

        .contact-item strong {
            color: #123a5a;
        }

        .faq-item {
            margin-bottom: 14px;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #e7edf3;
        }

        .faq-question {
            width: 100%;
            padding: 16px 18px;
            background: #f5f8fb;
            border: none;
            cursor: pointer;
            text-align: right;
            font-weight: bold;
            color: #123a5a;
            font-size: 1rem;
        }

        .faq-answer {
            display: none;
            padding: 16px 18px;
            background: #fff;
        }

        footer {
            text-align: center;
            padding: 24px 16px;
            margin-top: 30px;
            color: #666;
            border-top: 1px solid #e8eef3;
            background: #fafcfe;
        }

        .small-muted {
            color: #667;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            .hero {
                padding: 20px;
            }

            .card {
                padding: 20px;
            }

            .btn-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>تعمیرات لوازم خانگی محمد کرمی</h1>
    <p>تعمیر در منزل، سریع، مطمئن و تخصصی در تهران</p>
</header>

<div class="container">
    <section class="hero">
        <h2>شما زنگ بزنید، ما می‌آییم تعمیر کنیم در منزل</h2>
        <p>
            ارائه خدمات تخصصی تعمیرات انواع لوازم خانگی با پشتیبانی سریع، حضور در محل و بررسی دقیق مشکل دستگاه.
        </p>
        <div class="btn-row">
            <a class="btn btn-primary" href="tel:09120629234">تماس فوری: 09120629234</a>
            <a class="btn btn-secondary" href="#contact">مشاهده راه‌های ارتباطی</a>
        </div>
    </section>

    <div class="grid">
        <section class="card about">
            <h3>درباره ما</h3>
            <p>
                محمد کرمی با تجربه در تعمیر انواع لوازم خانگی، تلاش می‌کند خدماتی حرفه‌ای، سریع و قابل اعتماد در تهران ارائه دهد.
            </p>
        </section>

        <section class="card features">
            <h3>مزایای خدمات ما</h3>
            <ul>
                <li>حضور در محل</li>
                <li>پاسخگویی سریع</li>
                <li>تعمیر تخصصی</li>
                <li>مشاوره قبل از تعمیر</li>
            </ul>
        </section>

        <section class="card">
            <h3>ساعات کاری</h3>
            <p><strong>هر روز:</strong> ۹ صبح تا ۱۰ شب</p>
            <p class="small-muted">برای موارد فوری، تماس تلفنی بهترین گزینه است.</p>
        </section>

        <section class="card">
            <h3>آدرس</h3>
            <p>تهران، میدان ونک، خیابان ونک، جنب بانک ملت</p>
            <p><a href="https://maps.google.com/?q=تهران، میدان ونک، خیابان ونک، جنب بانک ملت" target="_blank">مشاهده در نقشه</a></p>
        </section>
    </div>

    <section class="card" id="contact" style="margin-top:24px;">
        <h2>راه‌های ارتباطی</h2>
        <div class="contact-box">
            <div class="contact-item"><strong>تلفن ثابت:</strong> 02126155707</div>
            <div class="contact-item"><strong>موبایل:</strong> 09120629234</div>
            <div class="contact-item"><strong>نام:</strong> محمد کرمی</div>
            <div class="contact-item"><strong>محل خدمت:</strong> تهران و مناطق اطراف</div>
            <a class="btn btn-primary" href="tel:09120629234" style="margin-top:14px;">برای تعمیر تماس بگیرید</a>
        </div>
    </section>

    <section class="card" style="margin-top:24px;">
        <h2>سوالات متداول</h2>

        <div class="faq-item">
            <button class="faq-question" onclick="toggleFaq(this)">چرا لباسشویی روشن نمی‌شود؟</button>
            <div class="faq-answer">
                ابتدا برق ورودی، دوشاخه، پریز و قفل درب بررسی شود. اگر مشکل ادامه داشت، احتمال خرابی برد یا قطعه داخلی وجود دارد.
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question" onclick="toggleFaq(this)">چرا یخچال خنک نمی‌کند؟</button>
            <div class="faq-answer">
                از بسته بودن درب، سلامت لاستیک دور درب، عملکرد فن و سطح گاز مبرد باید اطمینان حاصل شود.
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question" onclick="toggleFaq(this)">چرا ظرفشویی ظرف‌ها را تمیز نمی‌شوید؟</button>
            <div class="faq-answer">
                بهتر است قبل از چیدن ظروف، باقی‌مانده غذا پاک شود. همچنین گرفتگی بازوهای پاشش آب، فیلتر و فشار آب بررسی شود.
            </div>
        </div>
    </section>
</div>

<footer>
    ساخته شده با آتی نما
</footer>

<script>
    function toggleFaq(button) {
        const answer = button.nextElementSibling;
        answer.style.display = answer.style.display === 'block' ? 'none' : 'block';
    }
</script>

</body>
</html>

